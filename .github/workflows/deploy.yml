name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./backend

      - name: Build Frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::GitHub Actions secret KUBECONFIG is empty or not configured."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_CONTENT" | grep -E '^[[:space:]]*(apiVersion:[[:space:]]*v1|kind:[[:space:]]*Config)' >/dev/null; then
            printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          elif ! printf '%s' "$KUBECONFIG_CONTENT" | base64 --decode > "$HOME/.kube/config"; then
            echo "::error::KUBECONFIG must contain kubeconfig YAML or a valid Base64-encoded kubeconfig."
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          case "$server" in
            http://localhost*|https://localhost*|http://127.*|https://127.*|http://\[::1\]*|https://\[::1\]*)
              echo "::error::KUBECONFIG points to a loopback API server unavailable from GitHub-hosted runners."
              exit 1
              ;;
          esac

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f kubernetes/secret.yaml
          kubectl apply -f kubernetes/backend-deployment.yaml
          kubectl apply -f kubernetes/backend-service.yaml
          kubectl apply -f kubernetes/frontend-deployment.yaml
          kubectl apply -f kubernetes/frontend-service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/backend:latest
          kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend
