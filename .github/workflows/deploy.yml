name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh

    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          $env:DOCKER_PASSWORD | docker login -u $env:DOCKER_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Backend
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t "$($env:DOCKER_USERNAME)/backend:latest" ./backend

      - name: Build Frontend
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t "$($env:DOCKER_USERNAME)/frontend:latest" ./frontend

      - name: Push Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push "$($env:DOCKER_USERNAME)/backend:latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "$($env:DOCKER_USERNAME)/frontend:latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KUBECONFIG_CONTENT)) {
            throw "GitHub Actions secret KUBECONFIG is empty or not configured."
          }
          $configPath = Join-Path $HOME ".kube\config"
          New-Item -ItemType Directory -Force -Path (Split-Path $configPath) | Out-Null
          if ($env:KUBECONFIG_CONTENT -match '^\s*(apiVersion:\s*v1|kind:\s*Config)') {
            [IO.File]::WriteAllText($configPath, $env:KUBECONFIG_CONTENT)
          } else {
            try {
              $configBytes = [Convert]::FromBase64String($env:KUBECONFIG_CONTENT)
            } catch {
              throw "KUBECONFIG must contain kubeconfig YAML or a valid Base64-encoded kubeconfig."
            }
            [IO.File]::WriteAllBytes($configPath, $configBytes)
          }
          kubectl config current-context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f kubernetes/secret.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f kubernetes/backend-deployment.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f kubernetes/backend-service.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f kubernetes/frontend-deployment.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f kubernetes/frontend-service.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -f kubernetes/ingress.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update Kubernetes Deployment
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          kubectl set image deployment/backend "backend=$($env:DOCKER_USERNAME)/backend:latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl set image deployment/frontend "frontend=$($env:DOCKER_USERNAME)/frontend:latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status deployment/frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
